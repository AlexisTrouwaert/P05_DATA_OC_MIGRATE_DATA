services:
  mongodb:
    image: mongo:latest
    container_name: mon_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - p05_network

  migration:
    build: .
    container_name: mon_migration
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongodb
    volumes:
      - ./data:/app/data
    networks:
      - p05_network

networks:
  p05_network:

volumes:
  mongodb_data:
